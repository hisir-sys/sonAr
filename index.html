<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sonAr</title>

  <!-- Google Font: Caacupé One -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caacup%C3%A9+One&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="splash">

    <!-- grid background lives on #splash itself, see style.css -->

    <!-- the globe: a half circle sitting at the bottom of the screen -->
    <div id="globe"></div>

    <!-- the wordmark: badge circle + individual letters so we can
         animate each letter sliding in from behind separately -->
    <div id="wordmark">
      <span class="letter" id="letter-s">s</span>
      <span class="letter" id="letter-o">o</span>
      <span class="letter" id="letter-n">n</span>

      <span id="badge">
        <span class="letter" id="letter-a">A</span>
      </span>

      <span class="letter" id="letter-r">r</span>
      <span id="dots">...</span>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
